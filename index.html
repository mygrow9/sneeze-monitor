<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>夜間噴嚏監測</title>
<style>
:root {
  --bg: #15171a; --card: #1f2227; --line: #343840; --text: #e8eaed; --muted: #9aa0a6;
  --accent: #5b9dff; --red: #ff6b6b; --green: #4cc38a; --yellow: #f2c94c;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 "Microsoft JhengHei", system-ui, sans-serif; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
h1 { font-size: 18px; margin: 0; }
h2 { font-size: 16px; margin: 0 0 6px; }
h3 { font-size: 15px; margin: 16px 0 6px; }
main { max-width: 860px; margin: 0 auto; padding: 12px 16px 40px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-top: 12px; }
.muted { color: var(--muted); }
.hint { color: var(--muted); font-size: 13px; margin: 4px 0; display: block; }
.warn { background: #4a2d2d; color: #ffd0d0; padding: 12px 16px; }
button, select, input { font: inherit; color: var(--text); background: #2b2f36; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
button { cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: #07121f; font-weight: 600; }
button.yes { background: #5a2b2b; border-color: var(--red); }
.tab.active { background: var(--accent); color: #07121f; border-color: var(--accent); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.row.wrap { gap: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
label.slider { margin-top: 12px; }
input[type=range] { padding: 0; width: 100%; }
.stage { position: relative; }
#preview { width: 100%; max-height: 300px; background: #000; border-radius: 8px; display: block; }
#meter { position: relative; height: 14px; background: #101215; border-radius: 7px; margin-top: 8px; overflow: hidden; border: 1px solid var(--line); }
#meter-fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--green); transition: width .08s; }
#meter-fill.hot { background: var(--red); }
#meter-floor { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--yellow); left: 0; }
#meter-thr { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--red); left: 0; }
.status { margin: 10px 0 4px; font-weight: 600; }
.recent, .events { list-style: none; padding: 0; margin: 6px 0; }
.recent li { font-size: 14px; color: var(--muted); padding: 2px 0; }
.events li { display: flex; gap: 10px; align-items: center; padding: 7px 8px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
.events li:hover { background: #292d34; }
.events li.sel { border-color: var(--accent); background: #243145; }
.chip { font-size: 12px; padding: 1px 8px; border-radius: 10px; background: #3a3f47; }
.chip.yes { background: #7a2f2f; } .chip.no { background: #2f3a32; color: #9fc9ae; }
.player { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 10px; }
#player { width: 100%; max-height: 360px; background: #000; border-radius: 8px; }
#timeline { position: relative; height: 54px; background: #101215; border: 1px solid var(--line); border-radius: 8px; }
#timeline .tick { position: absolute; top: 34px; font-size: 11px; color: var(--muted); transform: translateX(-50%); }
#timeline .dot { position: absolute; top: 10px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--yellow); cursor: pointer; border: 2px solid transparent; }
#timeline .dot.yes { background: var(--red); } #timeline .dot.no { background: #5c636b; }
#timeline .dot.sel { border-color: #fff; }
.hour { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 1px 0; }
.hour .name { width: 48px; color: var(--muted); }
.hour .bar { height: 12px; background: #3a3f47; border-radius: 3px; position: relative; min-width: 2px; }
.hour .bar i { position: absolute; inset: 0 auto 0 0; background: var(--red); border-radius: 3px; }
#blackout { position: fixed; inset: 0; background: #000; z-index: 99; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #2a2a2a; user-select: none; }
#blackout[hidden] { display: none; }
#bo-text { font-size: 20px; white-space: pre; text-align: center; }
#bo-hint { position: absolute; bottom: 12px; font-size: 12px; color: #1c1c1c; }
@media (max-width: 560px) { main { padding: 8px 10px 30px; } }

</style>
</head>
<body>
<header>
  <h1>夜間噴嚏監測</h1>
  <nav>
    <button id="tab-monitor" class="tab active">監測</button>
    <button id="tab-review" class="tab">回顧</button>
  </nav>
</header>

<div id="unsupported" class="warn" hidden>
  這個瀏覽器不支援必要功能，請改用電腦版 <b>Chrome</b> 或 <b>Edge</b>。
</div>

<!-- ============ 監測 ============ -->
<main id="view-monitor">
  <section class="card">
    <h2>1. 選擇存放資料夾</h2>
    <p class="hint">影片和紀錄會存在這個資料夾，每晚一個子資料夾。</p>
    <div class="row">
      <button id="pick-folder">選擇資料夾</button>
      <span id="folder-name" class="muted">尚未選擇</span>
    </div>
  </section>

  <section class="card">
    <h2>2. 設定</h2>
    <div class="grid">
      <label>觸發前保留（秒）<input id="pre" type="number" min="1" max="30" value="5"></label>
      <label>觸發後錄（秒）<input id="post" type="number" min="5" max="60" value="20"></label>
      <label>單段最長（秒）<input id="max" type="number" min="20" max="180" value="60"></label>
      <label>自動刪除幾天前的資料夾（0＝不刪）<input id="keep" type="number" min="0" max="365" value="0"></label>
    </div>
    <label class="slider">靈敏度：比背景大聲 <b id="thr-val">12</b> dB 就觸發（約等於音量差 <b id="thr-pts">13</b> 分）
      <input id="thr" type="range" min="5" max="30" value="12">
      <span class="hint">數字越小越靈敏（越容易誤觸發），越大越遲鈍。音量條上的紅線是觸發線，綠色超過紅線就會錄。</span>
    </label>
  </section>

  <section class="card">
    <h2>3. 開始</h2>
    <div class="stage">
      <video id="preview" muted playsinline></video>
      <div id="meter"><div id="meter-fill"></div><div id="meter-floor"></div><div id="meter-thr"></div></div>
      <div id="level-text" class="muted">尚未開始</div>
    </div>
    <div class="row">
      <button id="start" class="primary">開始監測</button>
      <button id="stop" disabled>停止</button>
      <button id="dark" disabled>全黑模式</button>
    </div>
    <p id="status" class="status">待機中</p>
    <ul id="recent" class="recent"></ul>
    <p class="hint">開始前請確認：電腦已插電、不會睡眠（電源設定「睡眠：永不」）、這個分頁保持在最前面、鏡頭對準床。</p>
  </section>
</main>

<!-- ============ 回顧 ============ -->
<main id="view-review" hidden>
  <section class="card">
    <div class="row">
      <button id="review-pick">選擇資料夾</button>
      <select id="day-select"></select>
      <span id="review-info" class="muted"></span>
    </div>
  </section>
  <section class="card" id="review-body" hidden>
    <div id="timeline" aria-label="事件時間軸"></div>
    <div class="player">
      <video id="player" controls playsinline></video>
      <div class="player-side">
        <div id="player-title" class="muted">點選下方事件</div>
        <div class="row wrap">
          <button id="lab-yes" class="yes">是噴嚏 (Y)</button>
          <button id="lab-no">不是 (N)</button>
          <button id="lab-next">下一筆 (→)</button>
        </div>
      </div>
    </div>
    <h3>事件清單</h3>
    <ul id="events" class="events"></ul>
    <h3>每小時統計</h3>
    <div id="hours"></div>
  </section>
</main>

<div id="blackout" hidden>
  <div id="bo-text"></div>
  <div id="bo-hint">連點兩下螢幕或按 Esc 離開</div>
</div>
